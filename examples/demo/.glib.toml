version = "2"
verbose = false

[generate]
output = "generated"
package = "generated"
workers = 4
cache = true

[make]
controllers = "controllers"
providers = "services"
middleware = "middleware"

[watch]
debounce = 300
exclude_dirs = ["vendor", "node_modules", ".git", ".glib", "tmp"]
include_files = ["*.go"]
exclude_files = ["*_test.go", "*.gen.go"]

[validation]
enabled = false
languages = ["fr"]
default_language = "fr"

[i18n]
enabled = true
locales_dir = "locales"
default_locale = "fr"
supported_locales = ["en", "fr"]
detect_from = ["header", "query"]
query_param = "lng"
